# Portal Scanner Configuration
# Used by /career-ops scan to discover new offers automatically.
# Customized for: Senior Systems Architect / Technical & Delivery Lead,
# SatCom / Geospatial / Mapping domain, Canada + US targeting.
#
# Company `notes:` use a fixed tag vocabulary so they stay operational and
# never go stale:
#   "CA-based; <domain>"        home turf, no work-authorization friction
#   "CA+US entity"              dual presence — highest-priority category
#   "US-only"                   work authorization must be checked per role
#   "domain-adjacent"           partial domain match
# Selection rationale (why each company is here) lives in the career repo,
# not in this file.

# -- Location filter --
# Home region (Canada) always passes; US passes too (US roles are targeted,
# not excluded). A handful of clearly irrelevant overseas regions are blocked
# to keep the scan focused.
location_filter:
  always_allow:
    - "Canada"
    - "Ontario"
    - "Toronto"
    - "Ottawa"
  allow:
    - "Canada"
    - "Ontario"
    - "Toronto"
    - "Ottawa"
    - "Remote"
    - "United States"
    - "USA"
    - "U.S."
  block:
    - "India"
    - "United Kingdom"
    - "London"
    - "Germany"
    - "France"
    - "Singapore"
    - "Japan"
    - "Brazil"
    - "Australia"

# -- Title filter --
title_filter:
  positive:
    # -- Delivery / architecture / leadership roles --
    - "Systems Architect"
    - "Solutions Architect"
    - "Technical Lead"
    - "Tech Lead"
    - "Delivery Lead"
    - "Product Delivery Lead"
    - "Engineering Manager"
    - "Technical Program Manager"
    - "Program Manager, Technical"
    - "Principal Engineer"
    - "Staff Engineer"
    - "Systems Engineer"
    - "Software Engineer"
    - "Software Development Engineer"
    - "SDE"
    # -- Added 2026-08-12: "Backend Engineer" is a distinct market title that
    #    "Software Engineer" does NOT substring-match. Found via a Scribd req
    #    (Senior Backend Engineer, Content Foundations) that the scan missed. --
    - "Backend Engineer"
    - "Platform Engineer"
    - "Infrastructure Engineer"
    # -- Widened 2026-08-03: candidate is open to TPM/PM/SDE/EM broadly, not
    #    just architecture-track roles, as long as comp clears CAD 200K+. --
    - "Product Manager"
    - "Group Product Manager"
    - "Senior Product Manager"
    - "Program Manager"
    # -- Added 2026-08-11: Google Geo posts these in the JD body even when the
    #    listing title is the generic "Product Manager". --
    - "Technical Product Manager"
    - "Data Product Manager"
    # -- Added 2026-08-04 via `titles` mode. Pivot axis: evidenced by
    #    customer-facing SAT/deployment work and the live-executive-demo
    #    fix for Inmarsat. Honest gap accepted: no quota-carrying
    #    pre-sales experience -- expect this to be probed in interviews. --
    - "Solutions Engineer"
    - "Sales Engineer"
    # -- Domain match --
    - "Geospatial"
    - "Mapping"
    - "SatCom"
    - "Satellite"
    - "Network Management"
    - "NMS"
  negative:
    - "Junior"
    - "Intern"
    - "Entry Level"
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby"
    - "Salesforce Admin"
    - "SAP "
    - "Oracle EBS"
    - "Mainframe"
    - "COBOL"
    - "Blockchain"
    - "Web3"
    - "Crypto"
  seniority_boost:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head"
    - "Director"
    - "Manager"

# -- Salary filter (optional; opt-in) --
# Only applies where the ATS provider exposes salary data (Greenhouse, Ashby,
# Lever) — has no effect on scan_method: websearch entries. min is annual, in
# the currency below; roles with no salary data still pass (see scan.mjs).
salary_filter:
  min: 200000
  max: 0
  currency: "CAD"

# -- Search queries --
# Each query triggers a WebSearch. Use site: to filter by portal.
search_queries:
  - name: Greenhouse — Architect/Delivery/EM + geospatial-satcom
    query: 'site:boards.greenhouse.io ("Systems Architect" OR "Solutions Architect" OR "Engineering Manager" OR "Technical Program Manager") ("mapping" OR "geospatial" OR "satellite" OR "SatCom")'
    enabled: true

  - name: Ashby — Architect/Delivery/EM + geospatial-satcom
    query: 'site:jobs.ashbyhq.com ("Systems Architect" OR "Solutions Architect" OR "Engineering Manager" OR "Technical Program Manager") ("mapping" OR "geospatial" OR "satellite")'
    enabled: true

  - name: Lever — Architect/Delivery/EM + geospatial-satcom
    query: 'site:jobs.lever.co ("Systems Architect" OR "Solutions Architect" OR "Engineering Manager" OR "Technical Program Manager") ("mapping" OR "geospatial" OR "satellite" OR "SatCom")'
    enabled: true

  # -- Sponsorship-language roles (JD text explicitly mentions a route) --
  - name: Greenhouse — sponsorship-language roles
    query: 'site:boards.greenhouse.io ("Systems Architect" OR "Technical Lead" OR "Engineering Manager") ("TN visa" OR "L-1A" OR "O-1" OR "visa sponsorship")'
    enabled: true

# -- Tracked companies --
# Curated set verified against live Greenhouse/Lever/Ashby APIs (zero-token
# check) for the SatCom/geospatial/mapping domain plus known Canada+US dual
# presence. Smaller and hand-picked rather than a broad generic list —
# extend as you find more via /career-ops discover.

tracked_companies:

  # -- Direct SatCom / space-tech match, Canada-based (home turf) --

  - name: Telesat
    careers_url: https://jobs.lever.co/telesat
    api: https://api.lever.co/v0/postings/telesat?mode=json
    notes: "CA-based; satcom. Ottawa, ON — Canadian satellite operator."
    enabled: true

  - name: Kepler Communications
    careers_url: https://jobs.lever.co/kepler
    api: https://api.lever.co/v0/postings/kepler?mode=json
    notes: "CA+US entity; satcom. Toronto, ON HQ with a 'Kepler US' entity."
    enabled: true

  - name: Owner
    careers_url: https://jobs.ashbyhq.com/owner
    api: https://api.ashbyhq.com/posting-api/job-board/owner
    notes: "US-only; adjacent. Remote US/Canada — verify Canadian entity/EOR before applying; comp posted in USD."
    enabled: true

  - name: Shopify
    careers_url: https://www.shopify.com/careers
    scan_method: websearch   # no public Greenhouse/Lever/Ashby/Workday API (confirmed via discover-ats.mjs)
    scan_query: 'site:shopify.com/careers ("Software Engineer" OR "Engineering Manager" OR "Technical Program Manager" OR "Staff" OR "Principal") (backend OR infrastructure OR platform OR distributed)'
    notes: "CA-based; adjacent. Ottawa, ON HQ — home turf, no work-authorization friction. websearch-only, needs agent-driven scan mode (see note below)."
    enabled: false   # websearch-only: needs the agent-driven scan mode, same as the Phase 1 big-tech entries

  # -- Mapping / geospatial, US-based --

  - name: Esri
    careers_url: https://job-boards.greenhouse.io/esri
    api: https://boards-api.greenhouse.io/v1/boards/esri/jobs
    notes: "US-only; geospatial. Redlands, CA — market-leading GIS software."
    enabled: true

  - name: Mapbox
    careers_url: https://jobs.ashbyhq.com/mapbox
    api: https://api.ashbyhq.com/posting-api/job-board/mapbox
    notes: "US-only; geospatial. Mapping platform."
    enabled: true

  - name: Niantic
    careers_url: https://jobs.ashbyhq.com/niantic
    api: https://api.ashbyhq.com/posting-api/job-board/niantic
    notes: "US-only; geospatial. AR mapping (Niantic Spatial)."
    enabled: true

  - name: Zoox
    careers_url: https://jobs.lever.co/zoox
    api: https://api.lever.co/v0/postings/zoox?mode=json
    notes: "domain-adjacent; mapping. Foster City, CA (Amazon) — autonomy stack."
    enabled: true

  # -- Rideshare/mapping, already in pipeline via Lyft --

  - name: Lyft
    careers_url: https://app.careerpuck.com/job-board/lyft
    api: https://boards-api.greenhouse.io/v1/boards/lyft/jobs
    notes: "CA+US entity; mapping. Toronto office confirmed via live JD (Senior EM, Mapping, req 110805)."
    enabled: true

  # -- PHASE 1 TARGETS: Toronto geospatial/mapping at big-tech-tier employers
  #    with a US entity (internal-transfer signal). Manager titles preferred.
  #
  #    NOTE: these use scan_method: websearch because Google/Amazon-careers/
  #    Uber/Microsoft/Apple run custom career sites, not Greenhouse/Lever/Ashby.
  #    `node scan.mjs` is the ZERO-TOKEN scanner and cannot execute WebSearch,
  #    so these are no-ops there and are disabled to avoid a false "scanned"
  #    signal. Reach them with the agent-driven scan mode (/career-ops scan),
  #    which can run WebSearch, or check them manually. --

  - name: Google
    careers_url: https://www.google.com/about/careers/applications/jobs/results/?location=Toronto
    scan_method: websearch
    scan_query: 'site:google.com/about/careers ("Engineering Manager" OR "Technical Lead Manager" OR "Staff Software Engineer") (Maps OR geospatial OR mapping) Toronto OR Waterloo'
    notes: "CA+US entity; geospatial. Waterloo/Toronto/Montreal - Google Maps."
    enabled: false   # websearch-only: needs the agent-driven scan mode

  - name: Amazon
    careers_url: https://www.amazon.jobs/en/search?base_query=geospatial&loc_query=Canada
    scan_method: websearch
    scan_query: 'site:amazon.jobs ("Software Development Manager" OR "Senior Manager" OR "Principal Engineer") (geospatial OR mapping OR Kuiper OR Leo) Toronto OR Vancouver'
    notes: "CA+US entity; geospatial. Toronto/Vancouver - Maps, logistics geospatial, Leo/Kuiper. Runs L-1 at scale."
    enabled: false   # websearch-only: needs the agent-driven scan mode

  - name: Uber
    careers_url: https://www.uber.com/us/en/careers/list/?location=CAN-Ontario-Toronto
    scan_method: websearch
    scan_query: 'site:uber.com/careers ("Engineering Manager" OR "Senior Software Engineer") (Maps OR mapping OR geospatial) Toronto'
    notes: "CA+US entity; mapping. Toronto engineering presence."
    enabled: false   # websearch-only: needs the agent-driven scan mode

  - name: Microsoft
    careers_url: https://jobs.careers.microsoft.com/global/en/search?lc=Canada
    scan_method: websearch
    scan_query: 'site:jobs.careers.microsoft.com ("Software Engineering Manager" OR "Principal Software Engineer") (Maps OR geospatial) Toronto OR Vancouver'
    notes: "CA+US entity; geospatial. Bing/Azure Maps."
    enabled: false   # websearch-only: needs the agent-driven scan mode

  - name: Apple
    careers_url: https://jobs.apple.com/en-ca/search?location=canada-CANC
    scan_method: websearch
    scan_query: 'site:jobs.apple.com ("Engineering Manager" OR "Senior Software Engineer") (Maps OR geospatial) Canada'
    notes: "CA+US entity; mapping. Ottawa office - Apple Maps."
    enabled: false   # websearch-only: needs the agent-driven scan mode

  # -- SatCom/aerospace/mapping majors without a confirmed zero-token ATS API;
  #    fall back to websearch until a direct API is found (see /career-ops discover) --

  - name: MDA Space
    careers_url: https://mda.space/careers
    scan_method: websearch
    scan_query: 'site:mda.space "Systems Architect" OR "Engineering Manager" OR "Technical Lead"'
    notes: "CA-based; satcom. Brampton, ON — space/satellite prime (RADARSAT)."
    enabled: true

  - name: Viasat
    careers_url: https://careers.viasat.com
    scan_method: websearch
    scan_query: 'site:careers.viasat.com "Systems Architect" OR "Engineering Manager" OR "Technical Lead"'
    notes: "US-only; satcom. Carlsbad, CA — SatCom major."
    enabled: true

  - name: Hughes Network Systems
    careers_url: https://www.hughes.com/about-us/careers
    scan_method: websearch
    scan_query: 'site:hughes.com/about-us/careers "Systems Architect" OR "Engineering Manager"'
    notes: "US-only; satcom. Germantown, MD — SatCom major."
    enabled: true

  - name: HERE Technologies
    careers_url: https://www.here.com/company/careers
    scan_method: websearch
    scan_query: 'site:here.com "Systems Architect" OR "Engineering Manager" OR "Technical Lead" mapping'
    notes: "domain-adjacent; mapping. Amsterdam/Chicago — verify entity per role."
    enabled: true

  # -- AI labs / platform infrastructure (added 2026-08-11) --

  - name: Anthropic
    careers_url: https://job-boards.greenhouse.io/anthropic
    api: https://boards-api.greenhouse.io/v1/boards/anthropic/jobs
    notes: "US-only; platform/infra. SF/NYC/Seattle + London. Sponsors visas explicitly; no Canadian engineering entity, so no L-1A route. ~400 open roles."
    enabled: true

  # -- Aerospace networking / SDN — closest domain match found to date (2026-08-12) --

  - name: Aalyria
    careers_url: https://ats.rippling.com/aalyria-careers/jobs
    notes: "CA+US+UK entity; satcom/SDN. Spacetime = temporospatial SDN for satellite/aerospace networks — direct NMS+SatCom match. Ottawa-based Canada roles exist under CANADIAN export control (EIPA), which a Canadian citizen satisfies; US roles are ITAR US-person gated. Watch comp: Canada band ran below the CAD 200K floor."
    enabled: true
